[project]
name = "mykrml-25740287"
version = "0.3.0"
description = "Reusable machine learning utilities (data sourcing, feature engineering, targets, validation and metrics) for UTS 36120 AML assignments"
readme = "README.md"
authors = [
    { name = "vigneshcrack", email = "selvamvignesh12@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.2,<2.3",
    "requests>=2.32",
    "scikit-learn>=1.6.1,<1.7",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
